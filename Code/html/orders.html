<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop - Orders</title>
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="app-container">
        <!-- Header (Đã đồng bộ Giỏ hàng giống Home) -->
        <header class="header">
            <div class="logo">My Orders</div>
            <div class="header-icons">
                <span class="icon" onclick="openCart()" style="position: relative; cursor: pointer;">
                    🛒
                    <span id="cartBadge" class="cart-badge">0</span>
                </span>
            </div>
        </header>
        
        <!-- Order Content -->
        <div style="padding: 1rem;">
            
            <!-- Section 1: Active Orders -->
            <h3 style="margin-bottom: 0.75rem; color: #1f2937; font-size: 1rem;">Active Orders (Preparing)</h3>
            <div id="activeOrdersList">
                <!-- Dữ liệu Active Orders sẽ render vào đây -->
            </div>

            <div style="height: 1.5rem;"></div>
            
            <!-- Section 2: Purchase History -->
            <h3 style="margin-bottom: 0.75rem; color: #1f2937; font-size: 1rem;">Purchase History</h3>
            <div id="purchaseHistoryList">
                <!-- Dữ liệu Lịch sử sẽ render vào đây -->
            </div>

        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <span class="nav-icon">🏠</span><span>Home</span>
            </a>
            <a href="data.html" class="nav-item">
                <span class="nav-icon">📶</span><span>Data</span>
            </a>
            <a href="orders.html" class="nav-item active">
                <span class="nav-icon">📦</span><span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">👤</span><span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Nhúng file JS -->
    <script src="../js/orders.js"></script>
</body>
</html>
