<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Shop - Data Plans</title>
    <!-- Reuse home.css to keep styling consistent -->
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="logo">E-Shop</div>
            <div class="header-icons">
                <span class="icon" onclick="openCart()" style="position: relative; cursor: pointer;">
                    🛒
                    <span id="cartBadge" class="cart-badge">0</span>
                </span>
            </div>
        </header>

        <!-- Search Bar (Đồng bộ với Home) -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search data plans...">
        </div>

        <!-- Banner -->
        <div class="banner">
            <h2>Data Boost</h2>
            <p>Stay connected anywhere, anytime</p>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterData('all', this)">All</button>
            <button class="cat-btn" onclick="filterData('Broadband', this)">Broadband</button>
            <button class="cat-btn" onclick="filterData('MobileAddOn', this)">Mobile Add-On</button>
            <button class="cat-btn" onclick="filterData('Roaming', this)">Roaming</button>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="dataGrid">
            <!-- Data plans will be dynamically generated by data.js -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item" id="navHome">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="data.html" class="nav-item active" id="navData">
                <span class="nav-icon">📶</span>
                <span>Data</span>
            </a>
            <a href="orders.html" class="nav-item" id="navCart">
                <span class="nav-icon">🛍️</span>
                <span>Order</span>
            </a>
            <a href="profile.html" class="nav-item" id="navProfile">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </nav>

    </div>

    <!-- JS Link -->
    <script src="../js/data.js"></script>
</body>
</html>
