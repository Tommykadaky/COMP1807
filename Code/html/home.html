<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop - Home</title>
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">E-Shop</div>
            <div class="header-icons">
                <!-- Icon Giỏ hàng có tích hợp bộ đếm (Badge) -->
                <span class="icon" onclick="openCart()" style="position: relative; cursor: pointer;">
                    🛒
                    <span id="cartBadge" class="cart-badge">0</span>
                </span>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search products...">
        </div>

        <!-- Banner -->
        <div class="banner">
            <h2>Super Sale</h2>
            <p>Up to 50% off on Mobiles & Tablets</p>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterProducts('all', this)">All</button>
            <button class="cat-btn" onclick="filterProducts('Mobile', this)">Mobile</button>
            <button class="cat-btn" onclick="filterProducts('Tablet', this)">Tablet</button>
            <button class="cat-btn" onclick="filterProducts('Broadband', this)">Broadband</button>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid">
            <!-- Dữ liệu JS sẽ render ở đây -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <span class="nav-icon">🏠</span><span>Home</span>
            </a>
            <a href="data.html" class="nav-item">
                <span class="nav-icon">📶</span><span>Data</span>
            </a>
            <a href="orders.html" class="nav-item">
                <span class="nav-icon">📦</span><span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">👤</span><span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/home.js"></script>
</body>
</html>
