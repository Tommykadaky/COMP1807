<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop - Profile</title>
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">Profile</div>
        </header>

        <!-- Profile Content -->
        <div style="padding: 1rem;">
            
            <!-- User Info Card -->
            <div class="product-card" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-direction: row;">
                <div style="width: 4rem; height: 4rem; background-color: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; flex-shrink: 0;">
                    👤
                </div>
                <div>
                    <h3 style="color: #1f2937; margin-bottom: 0.25rem; font-size: 1.1rem;">Huynh Minh Tam</h3>
                    <p style="color: #6b7280; font-size: 0.85rem;">tam.huynh@email.com</p>
                </div>
            </div>

            <!-- Settings Menu -->
            <h3 style="margin-bottom: 0.75rem; color: #1f2937; font-size: 1rem;">Settings</h3>
            
            <div class="product-card" style="padding: 0; margin-bottom: 1.5rem;">
                <div onclick="openSettingModal('Account Settings')" style="padding: 1rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <span style="color: #374151; font-weight: 500; font-size: 0.9rem;">⚙️ Account Settings</span>
                    <span style="color: #9ca3af;">></span>
                </div>
                <div onclick="openSettingModal('Payment Methods')" style="padding: 1rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <span style="color: #374151; font-weight: 500; font-size: 0.9rem;">💳 Payment Methods</span>
                    <span style="color: #9ca3af;">></span>
                </div>
                <div onclick="openSettingModal('Notifications')" style="padding: 1rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <span style="color: #374151; font-weight: 500; font-size: 0.9rem;">🔔 Notifications</span>
                    <span style="color: #9ca3af;">></span>
                </div>
                <div onclick="openSettingModal('Help & Support')" style="padding: 1rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <span style="color: #374151; font-weight: 500; font-size: 0.9rem;">❓ Help & Support</span>
                    <span style="color: #9ca3af;">></span>
                </div>
                
                <!-- Nút chuyển sang trang Quản trị Admin -->
                <a href="admin.html" style="text-decoration: none; display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #f3f4f6; background-color: #f0fdf4;">
                    <span style="color: #16a34a; font-weight: 600; font-size: 0.9rem;">🛠️ Admin Management</span>
                    <span style="color: #16a34a;">></span>
                </a>

                <!-- Nút Log Out -->
                <div onclick="logoutUser()" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background-color: #fff5f5; border-bottom-left-radius: 0.75rem; border-bottom-right-radius: 0.75rem;">
                    <span style="color: #ef4444; font-weight: 600; font-size: 0.9rem;">🚪 Log Out</span>
                </div>
            </div>
            
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <span class="nav-icon">🏠</span><span>Home</span>
            </a>
            <a href="data.html" class="nav-item">
                <span class="nav-icon">📶</span><span>Data</span>
            </a>
            <a href="orders.html" class="nav-item">
                <span class="nav-icon">📦</span><span>Orders</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <span class="nav-icon">👤</span><span>Profile</span>
            </a>
        </nav>
    </div>

    <script src="../js/profile.js"></script>
</body>
</html>
